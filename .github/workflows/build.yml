name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;26.1.10909125" || sdkmanager "ndk;27.0.12077973" || true
          ls "$ANDROID_HOME/ndk" || true
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | head -1)
          if [ -n "$NDK_DIR" ]; then
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
            # Align gradle.properties ndkVersion with installed NDK
            NDK_VER=$(basename "$NDK_DIR")
            sed -i "s/^ndkVersion=.*/ndkVersion=$NDK_VER/" gradle.properties || true
            echo "Using NDK $NDK_VER"
          fi

      - name: Fetch Termux terminal modules (complete sources)
        run: |
          set -e
          git clone --depth 1 https://github.com/termux/termux-app.git /tmp/termux-app
          rm -rf terminal-emulator/src terminal-view/src
          cp -a /tmp/termux-app/terminal-emulator/src terminal-emulator/
          cp -a /tmp/termux-app/terminal-view/src terminal-view/
          echo "Module files:"
          find terminal-emulator/src terminal-view/src -type f | wc -l

      - name: Build Debug APK
        run: |
          # setup-gradle provides gradle; generate wrapper if absent
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
